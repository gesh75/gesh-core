name: CI

# Verify gesh-core installs cleanly from a fresh checkout and its parity tests
# pass — the single source of truth for the engine + product repos.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    # Lint + type gate runs once (not per matrix entry). The repo carries
    # [tool.ruff] / [tool.mypy] config but CI never enforced them until now.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package + lint/type tooling
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]" ruff mypy

      - name: Ruff
        run: ruff check src tests

      - name: Mypy
        run: mypy src

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"

      - name: Import every module (proves the package is self-contained)
        run: |
          python - <<'PY'
          import importlib
          from pathlib import Path

          root = Path("src/gesh_core")
          mods: set[str] = set()
          for path in root.rglob("*.py"):
              if "vendor" in path.parts:
                  continue
              rel = path.relative_to("src").with_suffix("").as_posix().replace("/", ".")
              if rel.endswith(".__init__"):
                  rel = rel[: -len(".__init__")]
              mods.add(rel)
          for name in sorted(mods):
              importlib.import_module(name)
          print("imported", len(mods), "modules OK")
          PY

      - name: Run tests
        run: pytest -q --cov=gesh_core --cov-report=term-missing
