[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gesh-core"
version = "0.7.0"
description = "Shared core modules for the GESH Financial engine and product repos (de-duplication / drift control)."
requires-python = ">=3.12"
# Direct third-party imports across the extracted modules:
#   numpy    — ecg, kelly, trading.indicators (module-level)
#   yfinance — kelly._fetch_returns (module-top import → hard dep); market_fetch
#              (used by kelly + trading.levels._fetch_atr). pandas comes transitively.
#   requests — sentiment_connector (Reddit JSON API; praw/nltk optional, lazy).
# NOTE: kelly._fetch_returns still does a lazy `import price_source` (a HOST-PROVIDED
# in-repo module, engine/product), resolved against the running process's sys.path —
# intentionally NOT declarable here, and it degrades gracefully when absent.
# (trading.levels._fetch_atr no longer touches the host consensus/price_source — it
# uses the shared gesh_core.market_fetch instead, as of v0.3.1.)
dependencies = [
    "numpy>=1.26",
    "yfinance>=0.2",
    "requests>=2.28",
]
# sentiment_connector additionally uses praw (Reddit API) + nltk VADER when
# present, but both are OPTIONAL — it degrades to the Reddit JSON API + keyword
# scoring via `requests`, so they are intentionally NOT hard dependencies.

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Pragmatic core set: pyflakes (F), pycodestyle errors (E), bugbear (B),
# isort (I), pyupgrade (UP). Best-effort network swallows are annotated with
# `# noqa: BLE001` at the call sites rather than globally silenced.
select = ["E", "F", "B", "I", "UP"]
ignore = ["E501"]  # long explanatory comments are intentional in this codebase

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true   # yfinance / praw / nltk ship no stubs
warn_redundant_casts = true
# Non-strict while the codebase adopts typing incrementally; tighten over time.

# Vendored third-party code (anthropics/claude-cookbooks @ f65eb122, MIT — see
# src/gesh_core/dcf/vendor/NOTICE.md) is byte-identical to upstream by policy and
# is not edited in place, so it is excluded from the type gate.
[[tool.mypy.overrides]]
module = "gesh_core.dcf.vendor.*"
ignore_errors = true
