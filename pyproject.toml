[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gesh-core"
version = "0.1.0"
description = "Shared core modules for the GESH Financial engine and product repos (de-duplication / drift control)."
requires-python = ">=3.12"
# Direct third-party imports across the extracted modules:
#   numpy    — ecg, kelly, trading.indicators (module-level)
#   yfinance — kelly._fetch_returns + trading.levels._fetch_atr (kelly imports it
#              at module top, so it must be a hard dep; pandas comes transitively).
# NOTE: kelly._fetch_returns and trading.levels._fetch_atr also do a lazy
# `import price_source` and `from consensus import ...`. Those are HOST-PROVIDED
# in-repo modules (engine/product), resolved against the running process's
# sys.path; they are intentionally NOT declarable here and degrade gracefully
# when absent.
dependencies = [
    "numpy>=1.26",
    "yfinance>=0.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
